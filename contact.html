  <head>
    <meta charset="UTF-8" />

      property="og:description"
      content="Contact Meraxis Labs about experiments on the board. Email hello@meraxislabs.com."
    />
    <meta property="og:image" content="https://www.meraxislabs.com/logo.png" />
    <meta name="twitter:card" content="summary" />
    <link rel="icon" href="favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="site-bg" aria-hidden="true"></div>
    <nav>
      <div class="container nav-bar">
        <a href="index.html" class="logo"><img src="logo.png" alt="Meraxis Labs" /></a>
        <button class="nav-toggle" type="button" aria-label="Toggle menu" aria-expanded="false">
          <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true">
            <path fill="currentColor" d="M2 4h14v1.5H2zm0 4.25h14v1.5H2zm0 4.25h14V14H2z" />
          </svg>
        </button>
        <div class="nav-links">
          <a href="experiments.html">Experiments</a>
          <a href="about.html">About</a>
          <a href="contact.html">Contact</a>
        </div>
      </div>
    </nav>
    <main class="page">
      <div class="container">
        <header class="page-hero">
          <p class="section-label">Company</p>
          <h1>Contact</h1>
          <p>Write if you want to talk about one of the experiments on the board.</p>
        </header>
        <p class="contact-direct">
          Email
          <a href="mailto:hello@meraxislabs.com">hello@meraxislabs.com</a>
        </p>
        <form class="form" data-contact>
          <label>Name<input name="name" autocomplete="name" required /></label>
          <label>Email<input name="email" type="email" autocomplete="email" required /></label>
          <label>Message<textarea name="message" required></textarea></label>
          <button class="btn btn-primary" type="submit">Open in email app</button>
          <p class="note" hidden>
            If your email app did not open, write to
            <a href="mailto:hello@meraxislabs.com">hello@meraxislabs.com</a>.
          </p>
        </form>
      </div>
    </main>
    <footer>
      <div class="container">
        <div class="footer-bottom">
          <span>© 2026 Meraxis Labs</span>
          <span><a href="experiments.html">Experiments</a> · <a href="about.html">About</a> · <a href="contact.html">Contact</a></span>
        </div>
      </div>
    </footer>
    <script src="site.js"></script>
  </body>
</html>
