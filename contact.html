<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Contact — Meraxis Labs</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="cosmic-bg" aria-hidden="true"></div>
    <nav>
      <div class="container nav-bar">
        <a href="index.html" class="logo"><img src="logo.png" alt="Meraxis Labs" /></a>
        <button class="nav-toggle" type="button" aria-label="Toggle menu" aria-expanded="false">☰</button>
        <div class="nav-links">
          <a href="experiments.html">Experiments</a>
          <a href="about.html">About</a>
          <a href="contact.html">Contact</a>
        </div>
      </div>
    </nav>
    <main class="page">
      <div class="container">
        <header class="page-hero">
          <p class="section-label">Company</p>
          <h1>Contact</h1>
          <p>Write if you want to talk about one of the experiments on the board.</p>
        </header>
        <form class="form" data-contact>
          <label>Name<input name="name" required /></label>
          <label>Email<input name="email" type="email" required /></label>
          <label>Message<textarea name="message" required></textarea></label>
          <button class="btn btn-primary" type="submit">Send</button>
          <p class="note" hidden>Thanks. This form does not send email yet — write to hello@getmeraxis.com.</p>
        </form>
      </div>
    </main>
    <footer>
      <div class="container">
        <div class="footer-bottom">
          <span>© 2026 Meraxis Labs</span>
          <span><a href="experiments.html">Experiments</a> · <a href="about.html">About</a> · <a href="contact.html">Contact</a></span>
        </div>
      </div>
    </footer>
    <script src="site.js"></script>
  </body>
</html>
